# Codegen policy for bucket.
#
# `user_owned` globs are files the schema generator must NEVER read, merge, or
# delete — `metaphor schema generate [--force]` skips them wholesale.
#
# This module was scaffolded by an earlier generator generation and grew
# hand-written subsystems throughout src/, so for a while the ENTIRE source tree
# was declared user-owned. The modernization pass of 2026-10-08 reconciled the
# tree with the current generator: every file under src/ was regenerated in a
# copy and compared, and only the files that would lose a name are listed below,
# beside the hand-written files the generator does not produce. Every other file
# under src/ is generated again.
#
# A file stays listed until its hand edits move into CUSTOM markers; check a
# regeneration loses nothing before you remove an entry.

user_owned:
